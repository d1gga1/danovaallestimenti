# Pubblica il sito su GitHub Pages SENZA la cartella strumenti (script, report
# interni, render sorgente): restano nel repository ma non finiscono online.
# Attivazione (una volta): GitHub > Settings > Pages > Build and deployment >
# Source: "GitHub Actions".
name: Pubblica sito
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prepara i file pubblici
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='strumenti' \
            --exclude='.DS_Store' --exclude='*.bak*' --exclude='.gitignore' \
            --exclude='README.md' --exclude='_google_business' --exclude='.htaccess' --exclude='_headers' ./ _site/
      - uses: actions/configure-pages@v5
      # v5 (aggiornato 23/11/2026): con v3 + deploy-pages@v4 GitHub non trovava piu' l'artifact "github-pages".
      # include-hidden-files: serve per pubblicare .well-known/ (security.txt) e .nojekyll.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      # GitHub Pages a volte risponde "Deployment failed, try again later" (errore temporaneo dei suoi server):
      # invece di fallire subito riproviamo altre due volte, a 1 e a 3 minuti di distanza.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Attesa prima del secondo tentativo
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Attesa prima del terzo tentativo
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 120
      - id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v5
      # Avvisa subito Bing (ChatGPT search, Copilot), Yandex, Seznam e Naver delle pagine
      # cambiate in questo push, tramite IndexNow. Se fallisce il sito resta pubblicato.
      - name: IndexNow (solo pagine cambiate)
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          sleep 60
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            python3 strumenti/indexnow.py
            exit 0
          fi
          URLS=$(git diff --name-only "$BEFORE" HEAD -- '*.html' | grep -v -e '^strumenti/' -e '^_google_business/' -e '^render/' -e '^private_area/' -e '^404.html$' | sed -e 's#index\.html$##' -e 's#^#/#')
          if [ -n "$URLS" ]; then python3 strumenti/indexnow.py $URLS; else echo "Nessuna pagina cambiata"; fi
