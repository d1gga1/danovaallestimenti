# Pubblica il sito su GitHub Pages SENZA la cartella strumenti (script, report
# interni, render sorgente): restano nel repository ma non finiscono online.
# Attivazione (una volta): GitHub > Settings > Pages > Build and deployment >
# Source: "GitHub Actions".
name: Pubblica sito
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepara i file pubblici
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='strumenti' \
            --exclude='.DS_Store' --exclude='*.bak*' --exclude='.gitignore' \
            --exclude='README.md' --exclude='_google_business' --exclude='.htaccess' --exclude='_headers' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      # Avvisa subito Bing (ChatGPT search, Copilot), Yandex, Seznam e Naver delle pagine
      # cambiate in questo push, tramite IndexNow. Se fallisce il sito resta pubblicato.
      - name: IndexNow (solo pagine cambiate)
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          sleep 60
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            python3 strumenti/indexnow.py
            exit 0
          fi
          URLS=$(git diff --name-only "$BEFORE" HEAD -- '*.html' | grep -v -e '^strumenti/' -e '^_google_business/' -e '^render/' -e '^404.html$' | sed -e 's#index\.html$##' -e 's#^#/#')
          if [ -n "$URLS" ]; then python3 strumenti/indexnow.py $URLS; else echo "Nessuna pagina cambiata"; fi
